name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # gitleaks needs history to scan the diff
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest   # coverage gate configured in pyproject.toml
      - name: Headless smoke run
        run: |
          python run.py --steps 300 --seed 1 --out runs/ci --snap-every 300 --save-every 150
          python run.py --resume runs/ci/world_000150.json.gz --steps 150 --out runs/ci-resume --snap-every 150
          python run.py --planet examples/volcanic.json --steps 200 --out runs/ci-planet --snap-every 200
          python run.py --planet examples/planet.png --steps 200 --out runs/ci-photo --snap-every 200

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      # --locked: build exactly the committed Cargo.lock; a dependency change must update it in the PR
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Dependency audit against the RustSec advisory database (prebuilt binary, no cargo install)
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037   # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
      # Committed golden sets are the Windows reference; gauss and the stepped hashes depend on
      # the platform maths library, so CI regenerates them on Linux and tests against those
      # (docs/G2_PLAN.md, "Golden sets per platform").
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        working-directory: .
      - name: Regenerate golden sets on Linux
        working-directory: .
        run: |
          python scripts/g2_golden.py --all engine-rs/target/golden-linux
      - run: cargo test --locked
        env:
          WORLDSIM_GOLDEN_DIR: ${{ github.workspace }}/engine-rs/target/golden-linux
