name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # gitleaks needs history to scan the diff
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest   # coverage gate configured in pyproject.toml
      - name: Headless smoke run
        run: |
          python run.py --steps 300 --seed 1 --out runs/ci --snap-every 300 --save-every 150
          python run.py --resume runs/ci/world_000150.json.gz --steps 150 --out runs/ci-resume --snap-every 150
          python run.py --planet examples/volcanic.json --steps 200 --out runs/ci-planet --snap-every 200
          python run.py --planet examples/planet.png --steps 200 --out runs/ci-photo --snap-every 200
