[package]
name = "worldsim-core"
version = "0.1.0"
edition = "2021"
description = "Rust reference kernel of the WorldSim engine (G2 port, ADR-0008)"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Saves are gzip JSON (worldsim/persistence.py). `float_roundtrip` makes float parsing exact,
# so every float of a save (written with Python's shortest repr) is read back bit for bit.
flate2 = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
# No fast-math exists in Rust; keep codegen conservative for reproducible floats.
lto = true
codegen-units = 1
